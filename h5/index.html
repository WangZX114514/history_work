<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>重走长征路 · 互动体验</title>
<style>
  :root {
    --bg: #14171c;
    --cream: #f3ecdc;
    --dim: #9aa0a8;
    --card: #f7f1e4;
    --ink: #23262c;
    --red: #b23b3b;
    --red-dark: #8e2c2c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; }
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));
  }
  .screen.active { display: flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- 开始页 ---------- */
  #screen-start { justify-content: center; align-items: center; text-align: center; overflow: hidden; }
  .start-hero {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 42%; opacity: .55;
  }
  .start-veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(20, 23, 28, .62) 0%, rgba(20, 23, 28, .58) 34%,
      rgba(20, 23, 28, .78) 62%, rgba(20, 23, 28, .96) 100%);
  }
  .start-inner {
    position: relative; display: flex; flex-direction: column;
    align-items: center; width: 100%;
  }
  .eyebrow { color: var(--dim); font-size: 13px; letter-spacing: 2px; margin: 0 0 18px; }
  #screen-start h1 {
    font-size: 40px; letter-spacing: 6px; margin: 0 0 10px; font-weight: 700;
    color: var(--cream); text-shadow: 0 2px 18px rgba(178, 59, 59, .35);
  }
  .sub { color: #cfc7b4; font-size: 14.5px; line-height: 1.9; margin: 0 0 34px; max-width: 340px; }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    background: var(--red); color: #fff;
    font-size: 17px; letter-spacing: 2px; font-weight: 600;
    padding: 15px 46px; border-radius: 999px;
    transition: transform .12s ease, background .2s ease;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.96); background: var(--red-dark); }
  .hint { color: var(--dim); font-size: 12px; margin-top: 22px; line-height: 1.8; }
  .linkbtn {
    appearance: none; border: 0; background: none; cursor: pointer;
    color: var(--dim); font-family: inherit; font-size: 12.5px;
    letter-spacing: 1px; margin-top: 14px; padding: 8px 10px;
    text-decoration: underline; text-underline-offset: 4px;
  }
  .linkbtn:active { color: var(--cream); }

  /* ---------- 创作说明 ---------- */
  .about-body {
    flex: 1; min-height: 0; overflow-y: auto;
    color: #e6ddc9; font-size: 15px; line-height: 1.95;
    padding: 4px 2px 12px;
  }
  .about-body p { margin: 0 0 12px; }
  .about-body h3 {
    font-size: 13px; color: var(--dim); font-weight: 600;
    letter-spacing: 1px; margin: 18px 0 8px;
  }
  .about-body ul { margin: 0; padding-left: 18px; }
  .about-body li { margin-bottom: 6px; }

  /* ---------- 关卡页 ---------- */
  .quiz-head {
    display: flex; flex-direction: column; gap: 4px;
    padding-bottom: 10px;
  }
  #quiz-step { color: var(--red); font-size: 13px; letter-spacing: 1px; }
  #quiz-title { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .head-step { color: var(--red); font-size: 13px; letter-spacing: 1px; }
  .head-title { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .quiz-body {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; justify-content: center;
  }
  .quiz-story {
    color: #e6ddc9; font-size: 16px; line-height: 2.0;
    padding: 6px 2px 14px;
  }
  .quiz-ask { color: var(--dim); font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--card); color: var(--ink);
    border: 0; border-radius: 14px; cursor: pointer;
    padding: 14px 16px; font-size: 15.5px; line-height: 1.55; text-align: left;
    font-family: inherit;
    transition: transform .12s ease, box-shadow .2s ease;
    touch-action: manipulation;
  }
  .opt:active { transform: scale(.98); }
  .opt .k { font-weight: 800; color: var(--red); flex: 0 0 auto; }

  /* short screens: tighten the quiz so all three options stay on one screen */
  @media (max-height: 660px) {
    .quiz-story { font-size: 15px; line-height: 1.85; }
    .opt { padding: 12px 14px; font-size: 15px; }
    .options { gap: 8px; }
    .quiz-ask { margin-bottom: 8px; }
  }

  /* ---------- 图片 + 配文 ---------- */
  #screen-view { cursor: pointer; }
  .view-inner {
    flex: 1; min-height: 0; width: 100%; max-width: 430px; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  #view-img {
    width: auto; max-width: 100%; max-height: 60vh;
    margin: 0 auto; border-radius: 10px; display: block;
    background: #0c0e11; box-shadow: 0 12px 34px rgba(0, 0, 0, .5);
  }
  .view-caption {
    color: #efe7d3; font-size: 15px; line-height: 1.9;
    max-height: 24vh; overflow-y: auto;
  }
  .view-hint { color: var(--dim); font-size: 12.5px; letter-spacing: 1px; }

  /* ---------- 失败页 ---------- */
  #screen-fail { justify-content: center; align-items: center; text-align: center; }
  #screen-fail h2 {
    color: var(--red); font-size: 34px; letter-spacing: 8px; margin: 0 0 18px;
  }
  #fail-title { color: var(--cream); font-size: 16px; line-height: 1.9; margin: 0 0 8px; }
  .fail-note { color: var(--dim); font-size: 13px; margin: 0 0 30px; }

  /* ---------- 胜利页 ---------- */
  #screen-win { justify-content: center; align-items: center; text-align: center; }
  #screen-win h2 {
    color: #d9b36c; font-size: 30px; letter-spacing: 6px; margin: 0 0 20px;
  }
  #win-text { color: #e6ddc9; font-size: 15px; line-height: 2.1; margin: 0 0 34px; max-width: 360px; }
</style>
</head>
<body>
<div id="app">

  <section id="screen-start" class="screen active">
    <img class="start-hero" id="start-hero" src="images/L01_A.jpg" alt="">
    <div class="start-veil"></div>
    <div class="start-inner">
    <p class="eyebrow">纪念红军长征胜利 90 周年</p>
    <h1>重走长征路</h1>
    <p class="sub">从于都河畔到三军会师，12 个历史抉择。<br>每一步都曾真实发生——选错，征程即止。</p>
    <button id="btn-start" class="btn">开始长征</button>
    <p class="hint">配图由 AI 生成（豆包 · Seedream）<br>史实依据《中国共产党简史》等权威资料</p>
    <button id="btn-about" class="linkbtn">创作说明 · 史料来源</button>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <header class="quiz-head">
      <span id="quiz-step"></span>
      <span id="quiz-title"></span>
    </header>
    <div class="quiz-body">
      <div class="quiz-story" id="quiz-story"></div>
      <div class="quiz-ask">你将如何抉择？</div>
      <div class="options" id="options"></div>
    </div>
  </section>

  <section id="screen-view" class="screen">
    <div class="view-inner">
      <img id="view-img" alt="">
      <div class="view-caption" id="view-caption"></div>
      <div class="view-hint" id="view-hint"></div>
    </div>
  </section>

  <section id="screen-fail" class="screen">
    <h2>失败</h2>
    <p id="fail-title"></p>
    <p class="fail-note">历史没有如果——回到起点，再走一次。</p>
    <button id="btn-retry" class="btn">回到起点</button>
  </section>

  <section id="screen-win" class="screen">
    <h2>长征胜利结束</h2>
    <p id="win-text"></p>
    <button id="btn-again" class="btn">再走一次</button>
  </section>

  <section id="screen-about" class="screen">
    <header class="quiz-head">
      <span class="head-step">纪念红军长征胜利 90 周年</span>
      <span class="head-title" id="about-title"></span>
    </header>
    <div class="about-body" id="about-body"></div>
    <button id="btn-about-back" class="btn">返回</button>
  </section>

</div>

const VIEW_MS_CORRECT = 5200;
const VIEW_MS_WRONG = 5200;
const FAIL_MS = 3400;

const $ = (s) => document.querySelector(s);
let idx = 0;
let busy = false;
let timer = null;

function show(id) {
  clearTimeout(timer); timer = null;
  document.querySelectorAll('.screen').forEach((el) => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function imgPath(levelNo, key) {
  return 'images/L' + String(levelNo).padStart(2, '0') + '_' + key + '.jpg';
}

function preloadAll() {
  LEVELS.forEach((L) => {
    ['A', 'B', 'C'].forEach((k) => { const im = new Image(); im.src = imgPath(L.n, k); });
  });
}

function start() {
  idx = 0; busy = false;
  preloadAll();
  renderLevel();
  show('screen-quiz');
}

function renderLevel() {
  const L = LEVELS[idx];
  $('#quiz-step').textContent = '第 ' + L.n + ' 关 / 共 ' + LEVELS.length + ' 关';
  $('#quiz-title').textContent = L.title;
  $('#quiz-story').textContent = L.story;
  $('#quiz-story').scrollTop = 0;
  const wrap = $('#options');
  wrap.innerHTML = '';
  L.options.forEach((o) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.k = o.k;
    const kEl = document.createElement('span');
    kEl.className = 'k'; kEl.textContent = o.k;
    const tEl = document.createElement('span');
    tEl.textContent = o.t;
    b.appendChild(kEl); b.appendChild(tEl);
    b.addEventListener('click', () => choose(o.k));
    wrap.appendChild(b);
  });
}

function choose(k) {
  if (busy) return;
  busy = true;
  const L = LEVELS[idx];
  const correct = k === L.correct;

  const img = $('#view-img');
  img.alt = L.title + ' · 选项' + k;
  img.dataset.k = k;
  img.onerror = () => {
    $('#view-hint').textContent =
      '配图未加载：请确认 images 文件夹与 index.html 在同一层级，且整个文件夹一起复制';
  };
  img.src = imgPath(L.n, k);

  if (correct) {
    $('#view-caption').textContent = L.pass;
    $('#view-hint').textContent = '抉择正确，继续前进…';
  } else {
    const w = L.wrong.find((x) => x.letter === k);
    $('#view-caption').textContent = '结局《' + w.ending + '》：' + w.text;
    $('#view-hint').textContent = '这个选择，把队伍带向了另一条路…';
  }
  $('#screen-view').scrollTop = 0;
  show('screen-view');

  timer = setTimeout(() => { advance(k); }, correct ? VIEW_MS_CORRECT : VIEW_MS_WRONG);
}

function advance(k) {
  clearTimeout(timer); timer = null;
  const L = LEVELS[idx];
  if (k === L.correct) next();
  else failToStart(k);
}

function skip() {
  if (!busy) return;
  const k = $('#view-img').dataset.k;
  advance(k);
}

function next() {
  busy = false;
  idx += 1;
  if (idx >= LEVELS.length) { show('screen-win'); return; }
  renderLevel();
  show('screen-quiz');
}

function failToStart(k) {
  const L = LEVELS[idx];
  const w = L.wrong.find((x) => x.letter === k);
  $('#fail-title').textContent = '第 ' + L.n + ' 关 · 结局《' + w.ending + '》';
  show('screen-fail');
  timer = setTimeout(() => { busy = false; show('screen-start'); }, FAIL_MS);
}

$('#btn-start').addEventListener('click', start);
$('#btn-again').addEventListener('click', start);
$('#btn-retry').addEventListener('click', () => { busy = false; show('screen-start'); });
$('#screen-view').addEventListener('click', skip);
$('#screen-fail').addEventListener('click', () => { busy = false; show('screen-start'); });

// ---- 创作说明 ----
function renderAbout() {
  document.getElementById('about-title').textContent = ABOUT.title;
  const body = document.getElementById('about-body');
  body.innerHTML = '';
  ABOUT.body.forEach((text) => {
    const p = document.createElement('p');
    p.textContent = text;
    body.appendChild(p);
  });
  const h3 = document.createElement('h3');
  h3.textContent = ABOUT.notesHeading;
  body.appendChild(h3);
  const ul = document.createElement('ul');
  ABOUT.notes.forEach((text) => {
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
  });
  body.appendChild(ul);
}

$('#btn-about').addEventListener('click', () => {
  renderAbout();
  document.getElementById('about-body').scrollTop = 0;
  show('screen-about');
});
$('#btn-about-back').addEventListener('click', () => show('screen-start'));

$('#win-text').textContent = '1936年10月，红军三大主力在会宁、将台堡胜利会师，宣告长征胜利结束。每一代人有每一代人的长征路——今天，你用自己的选择，走完了这条精神长征路。';
